services:

  api:
    build: .
    container_name: company-document-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  chatbot:
    build: .
    container_name: company-document-chatbot
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000/ask
    restart: unless-stopped